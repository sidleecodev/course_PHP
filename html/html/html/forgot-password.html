<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼 — 品牌名稱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- 全站唯一共用 CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><div class="logo-box">B</div><span>品牌名稱</span></a>
    <div class="auth-icon"><i class="fa fa-key"></i></div>
    <div class="auth-title">
      <h2>忘記密碼</h2>
      <p>請輸入您的電子郵件，我們將寄送重設連結</p>
    </div>

    <div class="alert alert-success hidden" id="sent-msg">
      <i class="fa fa-check-circle"></i>
      <div>重設密碼連結已寄出，請至信箱查收。若未收到，請檢查垃圾郵件資料夾。</div>
    </div>

    <form onsubmit="showSent(event)">
      <div class="form-group">
        <label class="form-label" for="fp-email">電子郵件</label>
        <div class="input-icon-wrap">
          <i class="fa fa-envelope icon"></i>
          <input type="email" id="fp-email" name="email" class="form-control" placeholder="example@email.com" required autocomplete="email" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="fp-btn"><i class="fa fa-paper-plane"></i> 寄送重設連結</button>
    </form>

    <div class="auth-footer"><a href="login.html"><i class="fa fa-arrow-left"></i> 返回登入</a></div>
  </div>

  <script src="js/main.js"></script>
  <script>

    function showSent(e) {
      e.preventDefault();
      document.getElementById('sent-msg').classList.remove('hidden');
      const btn = document.getElementById('fp-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-check"></i> 已寄出';
    }
  </script>
</body>
</html>
