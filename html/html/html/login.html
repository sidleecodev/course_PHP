<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員登入 — 品牌名稱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- 全站唯一共用 CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><div class="logo-box">B</div><span>品牌名稱</span></a>
    <div class="auth-title">
      <h2>會員登入</h2>
      <p>歡迎回來，請輸入帳號與密碼</p>
    </div>

    <div class="alert alert-danger hidden" id="login-error">
      <i class="fa fa-exclamation-circle"></i>
      <div>帳號或密碼錯誤，請再試一次。</div>
    </div>

    <form action="member.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="email">電子郵件</label>
        <div class="input-icon-wrap">
          <i class="fa fa-envelope icon"></i>
          <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com" required autocomplete="email" />
        </div>
      </div>
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="password">密碼</label>
          <a href="forgot-password.html" class="link-muted">忘記密碼？</a>
        </div>
        <div class="input-icon-wrap">
          <i class="fa fa-lock icon"></i>
          <input type="password" id="password" name="password" class="form-control" placeholder="請輸入密碼" required autocomplete="current-password" />
          <span class="pw-toggle" onclick="togglePw('password',this)"><i class="fa fa-eye"></i></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-check"><input type="checkbox" name="remember" value="1" /> 記住我</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-sign-in-alt"></i> 登入</button>
    </form>

    <div class="auth-divider">或</div>
    <div class="auth-footer">還沒有帳號？<a href="register.html">立即加入會員</a></div>
  </div>
  <a href="index.html" class="auth-back-home"><i class="fa fa-home"></i> 回首頁</a>

  <script src="js/main.js"></script>
</body>
</html>
