<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新增首頁輪播 — 品牌名稱 管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- 前台與後台共用同一份 CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body">
  <!-- ===== 側欄 ===== -->
  <aside class="admin-sidebar">
    <a href="index.html" class="admin-brand">
      <div class="logo-box">B</div>
      <div><span>品牌名稱</span><small>ADMIN</small></div>
    </a>
    <nav class="admin-nav">
      <div class="nav-group">總覽</div>
      <a href="index.html"><i class="fa fa-tachometer-alt"></i> 儀表板</a>
      <div class="nav-group">網站內容</div>
      <a href="banners.html" class="active"><i class="fa fa-images"></i> 首頁輪播</a>
      <a href="features.html"><i class="fa fa-medal"></i> 特色 / 核心價值</a>
      <a href="milestones.html"><i class="fa fa-history"></i> 大事記</a>
      <a href="team-members.html"><i class="fa fa-users"></i> 核心團隊</a>
      <a href="settings.html"><i class="fa fa-cog"></i> 網站設定</a>
      <div class="nav-group">最新消息</div>
      <a href="news.html"><i class="fa fa-newspaper"></i> 消息管理</a>
      <a href="news-categories.html"><i class="fa fa-folder"></i> 消息分類</a>
      <div class="nav-group">產品</div>
      <a href="products.html"><i class="fa fa-box-open"></i> 產品管理</a>
      <a href="product-categories.html"><i class="fa fa-folder-open"></i> 產品分類</a>
      <div class="nav-group">會員與訂單</div>
      <a href="orders.html"><i class="fa fa-receipt"></i> 訂單管理</a>
      <a href="members.html"><i class="fa fa-user-friends"></i> 會員管理</a>
      <a href="addresses.html"><i class="fa fa-map-marker-alt"></i> 會員地址</a>
      <div class="nav-group">系統</div>
      <a href="admins.html"><i class="fa fa-user-shield"></i> 管理員</a>
    </nav>
  </aside>

  <div class="admin-main">
    <!-- ===== 頂部列 ===== -->
    <header class="admin-topbar">
      <button class="admin-menu-toggle" aria-label="選單"><i class="fa fa-bars"></i></button>
      <div class="page-name">首頁輪播管理</div>
      <div class="admin-user">
        <a href="../index.html" target="_blank"><i class="fa fa-external-link-alt"></i> 前台</a>
        <span><i class="fa fa-user-circle"></i> 系統管理員</span>
        <a href="login.html" data-logout><i class="fa fa-sign-out-alt"></i> 登出</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2><i class="fa fa-images"></i> <span data-mode-text>新增首頁輪播</span></h2>
          <a href="banners.html" class="btn btn-light btn-sm"><i class="fa fa-arrow-left"></i> 返回列表</a>
        </div>
        <div class="admin-card-body">
          <!-- 網址帶 ?id=編號 時為「修改」，會自動帶入資料 -->
          <form class="admin-form" data-back="banners.html" novalidate>
          <div class="form-group">
            <label class="form-label" for="f_eyebrow">小標</label>
            <input type="text" id="f_eyebrow" name="eyebrow" value="" class="form-control" placeholder="例：全新系列 2025">
          </div>
          <div class="form-group">
            <label class="form-label" for="f_title">標題 <span class="req">*</span></label>
            <input type="text" id="f_title" name="title" value="" class="form-control" required>
            <p class="field-hint">用「|」換行，例：卓越品質|成就每一刻</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_description">說明</label>
            <textarea id="f_description" name="description" rows="3" class="form-control"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_btn_text">主要按鈕文字</label>
              <input type="text" id="f_btn_text" name="btn_text" value="" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="f_btn_url">主要按鈕連結</label>
              <input type="text" id="f_btn_url" name="btn_url" value="" class="form-control" placeholder="/products">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_btn2_text">次要按鈕文字</label>
              <input type="text" id="f_btn2_text" name="btn2_text" value="" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="f_btn2_url">次要按鈕連結</label>
              <input type="text" id="f_btn2_url" name="btn2_url" value="" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_image">背景圖片</label>
            <input type="file" id="f_image" name="image" accept="image/*" class="form-control" data-preview="f_image_preview">
            <img id="f_image_preview" class="img-preview hidden" alt="">
            <p class="field-hint">建議 1920×580，未上傳時使用下方背景色</p>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_bg_style">背景色</label>
              <select id="f_bg_style" name="bg_style" class="form-control"><option value="1">深藍</option><option value="2">墨綠</option><option value="3">咖啡</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_sort">排序</label>
              <input type="number" id="f_sort" name="sort" value="" class="form-control" min="0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-check"><input type="checkbox" name="is_active" value="1" checked> 顯示於首頁</label>
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 儲存</button>
              <a href="banners.html" class="btn btn-outline"><i class="fa fa-times"></i> 取消</a>
            </div>
          </form>
        </div>
      </div>

      <!-- 示範資料（修改時帶入表單用；實際系統由後端提供） -->
      <script type="application/json" id="records">{"1":{"eyebrow":"全新系列 2025","title":"卓越品質|成就每一刻","description":"嚴選頂級原料，結合精湛工藝，為您帶來無與倫比的使用體驗。","btn_text":"立即選購","btn_url":"/products","btn2_text":"了解更多","btn2_url":"/about","bg_style":"1","sort":1,"is_active":1},"2":{"eyebrow":"限時優惠","title":"夏季特惠|全館最高 8 折","description":"活動期間限定，多項人氣商品同步特價，把握機會立即搶購。","btn_text":"查看優惠商品","btn_url":"/products","btn2_text":"","btn2_url":"","bg_style":"2","sort":2,"is_active":1},"3":{"eyebrow":"會員獨享","title":"加入會員|享更多專屬好禮","description":"立即免費加入，獲得首購折扣、積點回饋與會員專屬活動通知。","btn_text":"免費加入","btn_url":"/register","btn2_text":"已是會員？登入","btn2_url":"/login","bg_style":"3","sort":3,"is_active":1}}</script>
    </main>
    <footer class="admin-footer">&copy; 2026 品牌名稱 管理系統</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
