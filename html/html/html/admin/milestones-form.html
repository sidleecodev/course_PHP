<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

</head>

      <div class="logo-box">B</div>

      <a href="milestones.html" class="active"><i class="fa fa-history"></i> 大事記</a>
      <a href="team-members.html"><i class="fa fa-users"></i> 核心團隊</a>

      <div class="nav-group">最新消息</div>
      <a href="news.html"><i class="fa fa-newspaper"></i> 消息管理</a>
      <a href="news-categories.html"><i class="fa fa-folder"></i> 消息分類</a>
      <div class="nav-group">產品</div>
      <a href="products.html"><i class="fa fa-box-open"></i> 產品管理</a>
      <a href="product-categories.html"><i class="fa fa-folder-open"></i> 產品分類</a>
      <div class="nav-group">會員與訂單</div>
      <a href="orders.html"><i class="fa fa-receipt"></i> 訂單管理</a>
      <a href="members.html"><i class="fa fa-user-friends"></i> 會員管理</a>
      <a href="addresses.html"><i class="fa fa-map-marker-alt"></i> 會員地址</a>
      <div class="nav-group">系統</div>
      <a href="admins.html"><i class="fa fa-user-shield"></i> 管理員</a>
    </nav>
  </aside>

  <div class="admin-main">
    <!-- ===== 頂部列 ===== -->
    <header class="admin-topbar">
      <button class="admin-menu-toggle" aria-label="選單"><i class="fa fa-bars"></i></button>
      <div class="page-name">大事記管理</div>
      <div class="admin-user">
        <a href="../index.html" target="_blank"><i class="fa fa-external-link-alt"></i> 前台</a>
        <span><i class="fa fa-user-circle"></i> 系統管理員</span>
        <a href="login.html" data-logout><i class="fa fa-sign-out-alt"></i> 登出</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2><i class="fa fa-history"></i> <span data-mode-text>新增大事記</span></h2>
          <a href="milestones.html" class="btn btn-light btn-sm"><i class="fa fa-arrow-left"></i> 返回列表</a>
        </div>
        <div class="admin-card-body">
          <!-- 網址帶 ?id=編號 時為「修改」，會自動帶入資料 -->
          <form class="admin-form" data-back="milestones.html" novalidate>
          <div class="form-row-3">
            <div class="form-group">
              <label class="form-label" for="f_year">年份 <span class="req">*</span></label>
              <input type="number" id="f_year" name="year" value="2026" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_month">月份</label>
              <select id="f_month" name="month" class="form-control"><option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option><option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option><option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_tag_type">類型</label>
              <select id="f_tag_type" name="tag_type" class="form-control"><option value="milestone">里程碑</option><option value="product">產品</option><option value="award">獲獎 / 認證</option></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_title">標題 <span class="req">*</span></label>
            <input type="text" id="f_title" name="title" value="" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_description">說明</label>
            <textarea id="f_description" name="description" rows="3" class="form-control"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_tag_label">標籤文字</label>
              <input type="text" id="f_tag_label" name="tag_label" value="" class="form-control" placeholder="例：里程碑 / 展店 / 認證">
            </div>
            <div class="form-group">
              <label class="form-label" for="f_icon">標籤圖示</label>
              <div class="input-icon-wrap">
                <i class="fa fa-star icon" id="f_icon_icon"></i>
                <input type="text" id="f_icon" name="icon" value="" class="form-control" placeholder="fa-star" data-icon-preview="f_icon_icon">
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-check"><input type="checkbox" name="is_highlight" value="1"> 重點事件（時間軸顯示金色圓點）</label>
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 儲存</button>
              <a href="milestones.html" class="btn btn-outline"><i class="fa fa-times"></i> 取消</a>
            </div>
          </form>
        </div>
      </div>

      <!-- 示範資料（修改時帶入表單用；實際系統由後端提供） -->
      <script type="application/json" id="records">{"1":{"year":2025,"month":11,"title":"年度客戶感謝活動圓滿落幕","description":"五百位貴賓蒞臨，現場展示全新旗艦系列，締造單日業績新高。","tag_type":"milestone","tag_label":"里程碑","icon":"fa-star","is_highlight":1},"2":{"year":2025,"month":8,"title":"全新秋冬系列產品正式發佈","description":"以「自然共生」為設計理念，推出12款環保材質新品。","tag_type":"product","tag_label":"產品","icon":"fa-box-open","is_highlight":0},"3":{"year":2025,"month":3,"title":"榮獲年度最佳品質獎","description":"由台灣優良商品協會評選，連續三年獲此殊榮。","tag_type":"award","tag_label":"獲獎","icon":"fa-trophy","is_highlight":0},"4":{"year":2024,"month":10,"title":"電商平台正式上線","description":"全新官方購物平台正式啟用，首月訂單逾千筆。","tag_type":"milestone","tag_label":"里程碑","icon":"fa-globe","is_highlight":0},"5":{"year":2024,"month":5,"title":"進駐台中全新旗艦店","description":"台中旗艦展示中心盛大開幕，佔地300坪。","tag_type":"milestone","tag_label":"展店","icon":"fa-store","is_highlight":0},"6":{"year":2024,"month":1,"title":"ISO 9001 品質認證通過","description":"取得國際品質管理系統認證。","tag_type":"award","tag_label":"認證","icon":"fa-certificate","is_highlight":0},"7":{"year":2023,"month":9,"title":"海外市場首次拓展至日本","description":"與日本代理商簽訂合作協議，正式踏入亞洲國際市場。","tag_type":"milestone","tag_label":"里程碑","icon":"fa-flag","is_highlight":0},"8":{"year":2020,"month":1,"title":"公司正式創立","description":"以「讓每個人都能擁有優質生活」為核心使命，踏出品牌第一步。","tag_type":"milestone","tag_label":"創立","icon":"fa-flag-checkered","is_highlight":1}}</script>
    </main>
    <footer class="admin-footer">&copy; 2026 品牌名稱 管理系統</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
