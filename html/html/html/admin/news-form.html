  <div class="admin-main">
    <!-- ===== 頂部列 ===== -->
    <header class="admin-topbar">
      <button class="admin-menu-toggle" aria-label="選單"><i class="fa fa-bars"></i></button>
      <div class="page-name">消息管理</div>
      <div class="admin-user">
        <a href="../index.html" target="_blank"><i class="fa fa-external-link-alt"></i> 前台</a>
        <span><i class="fa fa-user-circle"></i> 系統管理員</span>
        <a href="login.html" data-logout><i class="fa fa-sign-out-alt"></i> 登出</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2><i class="fa fa-newspaper"></i> <span data-mode-text>新增消息</span></h2>
          <a href="news.html" class="btn btn-light btn-sm"><i class="fa fa-arrow-left"></i> 返回列表</a>
        </div>
        <div class="admin-card-body">
          <!-- 網址帶 ?id=編號 時為「修改」，會自動帶入資料 -->
          <form class="admin-form" data-back="news.html" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_news_category_id">分類 <span class="req">*</span></label>
              <select id="f_news_category_id" name="news_category_id" class="form-control" required><option value="1">公司公告</option><option value="2">活動資訊</option><option value="3">產品動態</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_published_at">發佈日期 <span class="req">*</span></label>
              <input type="date" id="f_published_at" name="published_at" value="2026-10-10" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_title">標題 <span class="req">*</span></label>
            <input type="text" id="f_title" name="title" value="" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_excerpt">摘要</label>
            <textarea id="f_excerpt" name="excerpt" rows="2" class="form-control"></textarea>
            <p class="field-hint">列表頁顯示的簡短說明</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_content">內容</label>
            <textarea id="f_content" name="content" rows="10" class="form-control font-en"></textarea>
            <p class="field-hint">可使用 HTML：&lt;h3&gt;小標&lt;/h3&gt;、&lt;p&gt;段落&lt;/p&gt;</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_cover">封面圖片</label>
            <input type="file" id="f_cover" name="cover" accept="image/*" class="form-control" data-preview="f_cover_preview">
            <img id="f_cover_preview" class="img-preview hidden" alt="">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_icon">無封面時的圖示</label>
              <div class="input-icon-wrap">
                <i class="fa fa-newspaper icon" id="f_icon_icon"></i>
                <input type="text" id="f_icon" name="icon" value="fa-newspaper" class="form-control" placeholder="fa-star" data-icon-preview="f_icon_icon">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_views">瀏覽次數</label>
              <input type="number" id="f_views" name="views" value="0" class="form-control" min="0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-check"><input type="checkbox" name="is_published" value="1" checked> 發佈（取消勾選為草稿）</label>
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 儲存</button>
              <a href="news.html" class="btn btn-outline"><i class="fa fa-times"></i> 取消</a>
            </div>
          </form>
        </div>
      </div>
