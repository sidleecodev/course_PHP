  <div class="admin-main">
    <!-- ===== 頂部列 ===== -->
    <header class="admin-topbar">
      <button class="admin-menu-toggle" aria-label="選單"><i class="fa fa-bars"></i></button>
      <div class="page-name">網站設定管理</div>
      <div class="admin-user">
        <a href="../index.html" target="_blank"><i class="fa fa-external-link-alt"></i> 前台</a>
        <span><i class="fa fa-user-circle"></i> 系統管理員</span>
        <a href="login.html" data-logout><i class="fa fa-sign-out-alt"></i> 登出</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2><i class="fa fa-cog"></i> <span data-mode-text>新增網站設定</span></h2>
          <a href="settings.html" class="btn btn-light btn-sm"><i class="fa fa-arrow-left"></i> 返回列表</a>
        </div>
        <div class="admin-card-body">
          <!-- 網址帶 ?id=編號 時為「修改」，會自動帶入資料 -->
          <form class="admin-form" data-back="settings.html" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_label">項目名稱 <span class="req">*</span></label>
              <input type="text" id="f_label" name="label" value="" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_key">代碼（程式使用） <span class="req">*</span></label>
              <input type="text" id="f_key" name="key" value="" class="form-control" required data-readonly-on-edit>
              <p class="field-hint">小寫英文、數字與底線，修改時不可變更</p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_value">內容</label>
            <textarea id="f_value" name="value" rows="5" class="form-control"></textarea>
            <p class="field-hint">可使用 HTML，例如 &lt;br&gt;、&lt;span&gt;</p>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_type">欄位類型</label>
              <select id="f_type" name="type" class="form-control"><option value="text">單行文字</option><option value="textarea">多行文字 / HTML</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_sort">排序</label>
              <input type="number" id="f_sort" name="sort" value="" class="form-control" min="0">
            </div>
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 儲存</button>
              <a href="settings.html" class="btn btn-outline"><i class="fa fa-times"></i> 取消</a>
            </div>
          </form>
        </div>
      </div>

    </main>

  </div>
