  <div class="admin-main">
    <!-- ===== 頂部列 ===== -->
    <header class="admin-topbar">
      <button class="admin-menu-toggle" aria-label="選單"><i class="fa fa-bars"></i></button>
      <div class="page-name">特色 / 核心價值管理</div>
      <div class="admin-user">
        <a href="../index.html" target="_blank"><i class="fa fa-external-link-alt"></i> 前台</a>
        <span><i class="fa fa-user-circle"></i> 系統管理員</span>
        <a href="login.html" data-logout><i class="fa fa-sign-out-alt"></i> 登出</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2><i class="fa fa-medal"></i> <span data-mode-text>新增特色 / 核心價值</span></h2>
          <a href="features.html" class="btn btn-light btn-sm"><i class="fa fa-arrow-left"></i> 返回列表</a>
        </div>
        <div class="admin-card-body">
          <!-- 網址帶 ?id=編號 時為「修改」，會自動帶入資料 -->
          <form class="admin-form" data-back="features.html" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f_group">顯示區塊 <span class="req">*</span></label>
              <select id="f_group" name="group" class="form-control" required><option value="home">首頁核心優勢</option><option value="about">關於我們核心價值</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f_icon">圖示 <span class="req">*</span></label>
              <div class="input-icon-wrap">
                <i class="fa fa-star icon" id="f_icon_icon"></i>
                <input type="text" id="f_icon" name="icon" value="" class="form-control" placeholder="fa-star" data-icon-preview="f_icon_icon" required>
              </div>
              <p class="field-hint">Font Awesome 圖示名稱，例：fa-truck</p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_title">標題 <span class="req">*</span></label>
            <input type="text" id="f_title" name="title" value="" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_description">說明</label>
            <textarea id="f_description" name="description" rows="3" class="form-control"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="f_sort">排序</label>
            <input type="number" id="f_sort" name="sort" value="" class="form-control" min="0">
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 儲存</button>
              <a href="features.html" class="btn btn-outline"><i class="fa fa-times"></i> 取消</a>
            </div>
          </form>
        </div>
      </div>

      <!-- 示範資料（修改時帶入表單用；實際系統由後端提供） -->
      <script type="application/json" id="records">{"1":{"group":"home","icon":"fa-medal","title":"嚴格品質把關","description":"每件產品出廠前均通過多道檢測程序，確保每一次購買都令您滿意。","sort":1},"2":{"group":"home","icon":"fa-truck","title":"快速安全配送","description":"與台灣主要物流合作，訂單成立後 24 小時內出貨，全程追蹤貨態。","sort":2},"3":{"group":"home","icon":"fa-headset","title":"專業客服支援","description":"週一至週六 09:00–18:00 專人服務，LINE 官方帳號隨時為您解答。","sort":3},"4":{"group":"about","icon":"fa-star","title":"品質至上","description":"嚴格把關每一個生產環節，只有達到最高標準的產品才能到達客戶手中。","sort":4},"5":{"group":"about","icon":"fa-lightbulb","title":"持續創新","description":"保持對新技術與設計趨勢的敏感度，不斷突破自我。","sort":1},"6":{"group":"about","icon":"fa-heart","title":"客戶優先","description":"傾聽每一位客戶的聲音，以同理心理解需求，提供真正貼心的服務。","sort":2},"7":{"group":"about","icon":"fa-leaf","title":"永續發展","description":"致力於環境友善的生產方式，減少碳足跡。","sort":3}}</script>
    </main>
    <footer class="admin-footer">&copy; 2026 品牌名稱 管理系統</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
